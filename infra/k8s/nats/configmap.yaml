apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: oceanops
data:
  nats.conf: |
    # NATS Server Configuration for OceanOps
    port: 4222

    # WebSocket listener for browser clients (nats.ws)
    websocket {
      port: 9222
      no_tls: true
    }

    # JetStream for message persistence and replay
    jetstream {
      store_dir: "/data/jetstream"
      max_memory_store: 256MB
      max_file_store: 1GB
    }

    http_port: 8222
    debug: false
    trace: false
    logtime: true
