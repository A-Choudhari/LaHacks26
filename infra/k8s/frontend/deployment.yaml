apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: oceanops
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: oceanops/frontend:dev   # TODO: update from CI
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: 80
          #   initialDelaySeconds: 5
          #   periodSeconds: 10
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: 80
          #   initialDelaySeconds: 10
          #   periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: oceanops
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  # TODO (stretch): switch to LoadBalancer or add Ingress + cert-manager TLS
  type: ClusterIP
