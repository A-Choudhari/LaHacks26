# Start the sample-data demo with docker compose -f infra/docker-compose.yml up --build
services:
  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend/Dockerfile
    environment:
      OCEANOPS_DEMO: ${OCEANOPS_DEMO:-true}
      NATS_URL: nats://nats:4222
      OLLAMA_URL: http://ollama:11434
      GEMMA_MODEL: ${GEMMA_MODEL:-gemma4:e4b}
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy

  nats:
    profiles: ["connected"]
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ../nats-server.conf:/etc/nats/nats.conf:ro
      - nats_data:/data/jetstream
    working_dir: /
    ports:
      - "127.0.0.1:9222:9222"

  ollama:
    profiles: ["connected"]
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama

volumes:
  nats_data:
  ollama_models:
