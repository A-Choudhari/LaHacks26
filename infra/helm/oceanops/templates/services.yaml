{{/*
  TODO: Mirror the backend.yaml pattern for NATS, Ollama, and Frontend.
  Each service follows the same structure:
    1. Deployment (with .Values.<service>.replicaCount, image, resources, probes)
    2. Service (ClusterIP pointing to the Deployment)
    3. Any service-specific extras (ConfigMap, PVC, etc.)

  Stubs below — fill them in one service at a time.
*/}}

# ── NATS ──────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oceanops.fullname" . }}-nats
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oceanops.labels" . | nindent 4 }}
    app: nats
spec:
  replicas: {{ .Values.nats.replicaCount }}
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: {{ .Values.nats.image.repository }}:{{ .Values.nats.image.tag }}
          # TODO: mount ConfigMap nats-config when you fill in nats.conf content
          args: ["--jetstream", "--http_port", "8222"]
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitoring
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          # TODO: add readiness/liveness probes (see k8s/nats/deployment.yaml)
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oceanops.fullname" . }}-nats
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitoring
      port: 8222
      targetPort: 8222
  type: ClusterIP

---
# ── Ollama ────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oceanops.fullname" . }}-ollama
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oceanops.labels" . | nindent 4 }}
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # TODO: add initContainer to pull model (see k8s/ollama/deployment.yaml)
      containers:
        - name: ollama
          image: {{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}
          ports:
            - containerPort: 11434
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          {{- if .Values.ollama.gpu.enabled }}
          # TODO: GPU resource limit is injected here when gpu.enabled=true
          # resources.limits."nvidia.com/gpu": "1"
          {{- end }}
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          {{- if .Values.ollama.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "oceanops.fullname" . }}-ollama-models
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oceanops.fullname" . }}-ollama
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
  type: ClusterIP
{{- if .Values.ollama.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "oceanops.fullname" . }}-ollama-models
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.ollama.persistence.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
{{- end }}

---
# ── Frontend ──────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oceanops.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oceanops.labels" . | nindent 4 }}
    app: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: {{ include "oceanops.image" (dict "global" .Values.global "service" .Values.frontend) }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- if .Values.frontend.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.readinessProbe.path }}
              port: 80
            initialDelaySeconds: {{ .Values.frontend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.readinessProbe.periodSeconds }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oceanops.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
