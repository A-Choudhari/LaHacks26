name: Deploy to Cluster

# The cluster and its credentials are managed by the repository owner.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Successfully built OceanOps image tag"
        type: string
        required: true

jobs:
  deploy:
    name: Helm Upgrade
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.14.0"

      # TODO: choose ONE of the two auth blocks below depending on your cloud:

      # ── Option A: GKE Autopilot ──────────────────────────────────────────
      # - name: Authenticate to GKE
      #   uses: google-github-actions/auth@v2
      #   with:
      #     credentials_json: ${{ secrets.GCP_SA_KEY }}
      # - name: Get GKE credentials
      #   uses: google-github-actions/get-gke-credentials@v2
      #   with:
      #     cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
      #     location: ${{ secrets.GKE_REGION }}

      # ── Option B: EKS Fargate ────────────────────────────────────────────
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: ${{ secrets.AWS_REGION }}
      # - name: Update kubeconfig for EKS
      #   run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Deploy with Helm
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          helm upgrade --install oceanops infra/helm/oceanops \
            --namespace oceanops \
            --create-namespace \
            -f infra/helm/oceanops/values.prod.yaml \
            --set-string "global.imageTag=$IMAGE_TAG" \
            --set-string "global.imageRegistry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" \
            --wait \
            --timeout 5m

      # TODO: add a smoke test after deploy
